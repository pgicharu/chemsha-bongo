<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Forgot password · Chemsha Bongo</title>
    <link rel="stylesheet" href="./css/theme-matatu.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <div class="trim"></div>
    <main class="page">
      <section class="auth-card">
        <h1>Forgot your password?</h1>
        <p>Type the email you signed up with. We'll send you a link to choose a new password.</p>
        <p class="notice" id="notice" tabindex="-1" role="alert"></p>
        <form class="auth-form" id="forgot-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="field__input" id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" inputmode="email" autocapitalize="off" spellcheck="false" />
            <p class="field__error" id="email-error"></p>
          </div>
          <button class="button" type="submit">Send reset link</button>
        </form>
        <ul class="auth-links">
          <li><a href="/login">Back to log in</a></li>
        </ul>
      </section>
    </main>
    <script type="module" src="./js/auth/forgot.js"></script>
  </body>
</html>
