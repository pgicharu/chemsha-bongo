<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Choose a new password · Chemsha Bongo</title>
    <link rel="stylesheet" href="./css/theme-matatu.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <div class="trim"></div>
    <main class="page">
      <section class="auth-card">
        <h1>Choose a new password</h1>
        <p class="notice" id="notice" tabindex="-1" role="alert"></p>
        <form class="auth-form" id="reset-form" novalidate>
          <div class="field">
            <label class="field__label" for="password">New password</label>
            <span class="field__hint" id="password-hint">At least 8 characters.</span>
            <input class="field__input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error" minlength="8" maxlength="200" />
            <p class="field__error" id="password-error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="password2">New password again</label>
            <input class="field__input" id="password2" name="password2" type="password" autocomplete="new-password" required aria-describedby="password2-error" minlength="8" maxlength="200" />
            <p class="field__error" id="password2-error"></p>
          </div>
          <button class="button" type="submit">Save new password</button>
        </form>
        <ul class="auth-links">
          <li><a href="/forgot">Ask for a new link</a></li>
          <li><a href="/login">Back to log in</a></li>
        </ul>
      </section>
    </main>
    <script type="module" src="./js/auth/reset.js"></script>
  </body>
</html>
