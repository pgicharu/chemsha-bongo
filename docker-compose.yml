# Local stack (`make up`). Ports: `make urls`. Memory limits keep the whole
# stack within an 8 GB machine (README.md, "Memory").

name: chemsha-bongo

# json-file is explicit because Alloy tails those files; rotation bounds disk use.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # development accepts the example secrets; docker-compose.prod.yml sets
      # production, where the app refuses them.
      NODE_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chemsha-bongo}
      # No colon in ${VAR-default}: an empty value stays empty and the
      # grafana_reader user is skipped (src/grafana-reader.js).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD-grafana-reader-local-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  postgres:
    image: postgres:18.6
    # Only these three, not the whole .env: app secrets stay out of this container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Localhost only: reachable by local psql, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------

  # Grafana, Prometheus, Loki, Tempo, Pyroscope and an OTel collector in one
  # container. Prometheus scrapes app:3000/metrics; Alloy pushes logs to Loki;
  # the app pushes OTLP traces to :4318.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      # Grafana on 3001 (the app has 3000).
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:9090:9090"
      # OTLP gRPC/HTTP, for an app run outside Docker.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      # Anonymous Admin access; acceptable only because ports bind to 127.0.0.1.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Read by observability/grafana/datasources.yaml (Postgres data source).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD-grafana-reader-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-chemsha}
    volumes:
      - lgtm-data:/data
      # These replace the image's own config files.
      - ./observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
    healthcheck:
      # The image's check, run more often than its 30 s default.
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # About 800 MB after warm-up, growing slowly with stored data.
          memory: 1536M

  # Tails container log files and ships them to Loki (observability/alloy/config.alloy).
  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Rootless Docker: set DOCKER_CONTAINERS_DIR and DOCKER_SOCK in .env.
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      # Socket is used only to look up Compose service names for labels.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    depends_on:
      - lgtm
    healthcheck:
      # The image has no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # External uptime checks. The app's health URL inside Docker: http://app:3000/health
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    ports:
      # Published on 3002 (Grafana has 3001).
      - "127.0.0.1:3002:3001"
    environment:
      # Also skips the "choose a database" page on first visit.
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # Host and container resource charts. Reads host /proc and /sys read-only.
  # Never claimed to Netdata Cloud (no NETDATA_CLAIM_*), so data stays local.
  netdata:
    image: netdata/netdata:v2.12.1
    pid: host
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE   # read other processes' details (per-process charts)
      - SYS_ADMIN    # read some kernel statistics (e.g. network namespaces)
    security_opt:
      - apparmor:unconfined
    environment:
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  # Optional bot traffic (`make traffic-up`): live games in a loop. Needs
  # DATABASE_URL and SESSION_SECRET because bots create their own sessions.
  traffic:
    build: .
    profiles: ["traffic"]
    # node directly, not npm, so the stop signal reaches the script and the
    # running game ends cleanly.
    command: ["node", "scripts/bots.js", "--auto-host", "--count", "${TRAFFIC_BOTS:-15}"]
    env_file: .env
    environment:
      NODE_ENV: development # same reason as the app's
      BOTS_URL: http://app:3000
    depends_on:
      - app
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  # Optional local mail catcher (`make mail-up`).
  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: ["mail"]
    ports:
      # Localhost only: the inbox holds login and password-reset links.
      - "127.0.0.1:8025:8025"   # web inbox
      - "127.0.0.1:1025:1025"   # SMTP, for an app run outside Docker
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
  lgtm-data:
  alloy-data:
  uptime-kuma-data:
  netdata-config:
  netdata-lib:
  netdata-cache:
